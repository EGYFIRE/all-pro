name: Build Android APK (مسرح الجريمة)

# السورس خاص في EGYFIRE/Masrah ولا يُبنى هناك أبدًا: الريبوهات الخاصة تشترك في
# 2000 دقيقة شهريًا فقط. البناء يتم هنا (ريبو عام = دقائق مجانية غير محدودة)،
# والناتج يُنشر كـ Release على هذا الريبو بتاج يبدأ بـ masrah-.
#
# الإصدار يُنشر **مسوّدة** دائمًا: الريبو عام ليأخذ الدقائق المجانية، لا لينشر
# النسخ للعامة. لإخفاء أو تنظيف إصدارات قديمة: Actions ← حماية الإصدارات،
# بالبادئة masrah-.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "الفرع أو الكوميت في الريبو الخاص المطلوب بناؤه"
        required: false
        default: "claude/horizon-game-development-yjwpuk"
      run_tests:
        description: "تشغيل التحليل والاختبارات قبل البناء"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  build:
    name: بناء ونشر مسرح الجريمة
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # الفحص قبل أي حاجة تانية.
      #
      # كان بعد الـcheckout و JDK و Android SDK و Flutter والاختبارات — يعني
      # سبع دقايق شغل قبل ما يكتشف إن السر ناقص. الفحص اللي بيتأخر بيكلّف
      # نفس الوقت اللي هو موجود عشان يوفّره.
      - name: التأكد من مفتاح التوقيع
        env:
          KEYSTORE_B64: ${{ secrets.MASRAH_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MASRAH_KEYSTORE_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ]      && missing="$missing MASRAH_KEYSTORE_B64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing MASRAH_KEYSTORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::أسرار ناقصة:$missing — من غيرها كل بناء بيطلع بتوقيع مختلف، واللاعب مايقدرش يحدّث النسخة اللي عنده من غير ما يمسحها."
            exit 1
          fi
          echo "المفتاح موجود."

      - name: Checkout source (private repo)
        uses: actions/checkout@v4
        with:
          repository: EGYFIRE/Masrah
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      # بناءان على رَنَر واحد لا يركبان معًا: الأول ينجح، والثاني يموت وهو ينسخ
      # ناتجه على قرص فيه صفر بايت. الحذف قبل البدء أرخص من إعادة البناء.
      - name: تفريغ مساحة على الرَنَر
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /opt/ghc || true
          df -h /

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # `packages: ''` مقصودة.
      #
      # الافتراضي في الـaction هو `tools platform-tools`، و«tools» دي حزمة
      # جوجل شالتها من المستودع — فالـaction بقى بيقع بـ«Failed to find
      # package 'tools'» من غير ما حاجة في المشروع تتغيّر. (بناء ٤٠ عدّى،
      # وبناء ٤١ وقع على نفس الكود تقريبًا.)
      #
      # والصورة بتاعة الرَنَر فيها الـSDK متسطّب أصلًا، وFlutter وGradle
      # بينزّلوا اللي ناقصهم. فالخطوة دي مالهاش لازمة غير إنها تظبط
      # ANDROID_HOME.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: تنزيل الحزم
        working-directory: apps/mobile
        run: flutter pub get

      - name: تحليل الكود
        if: ${{ inputs.run_tests == 'true' }}
        working-directory: apps/mobile
        run: flutter analyze

      - name: اختبارات التطبيق
        if: ${{ inputs.run_tests == 'true' }}
        working-directory: apps/mobile
        run: flutter test

      # رقم النسخة من عدّاد التشغيل نفسه، فكل APK له رقم مختلف واللاعب يقدر يقول
      # «أنا على ٤٢» بدل «أنا على آخر واحدة».
      - name: تحديد رقم الإصدار
        id: version
        run: |
          # أقل من ١ بقصد: النسخة الأولى على Google Play هي اللي تبقى ١٫٠،
          # واللي قبلها كلها تجارب. عدّاد التشغيل هو رقم البناء، فكل APK له
          # رقم أعلى من اللي قبله ومحدش بيلخبط.
          VERSION="0.0.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=masrah-v$VERSION-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "بناء الإصدار $VERSION"

      # فك المفتاح قبل البناء.
      #
      # قبل كده البناء كان بيوقّع بمفتاح الـdebug، والرَنَر بيعمل واحد جديد كل
      # مرة — فكل نسخة بتطلع ببصمة مختلفة. النتيجة إن أندرويد بيرفض يحدّث
      # نسخة فوق نسخة توقيعها مختلف، فاللاعب بيمسح ويسطّب من أول وبيضيّع
      # بياناته؛ و App Links مستحيلة لأنها متعلّقة بالبصمة.
      - name: تجهيز مفتاح التوقيع
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.MASRAH_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::سر MASRAH_KEYSTORE_B64 مش موجود — من غيره كل بناء"\
                 " بيطلع بتوقيع مختلف، واللاعب مايقدرش يحدّث النسخة اللي عنده."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/masrah.jks"
          echo "path=$RUNNER_TEMP/masrah.jks" >> "$GITHUB_OUTPUT"

      - name: بناء APK
        working-directory: apps/mobile
        env:
          MASRAH_KEYSTORE: ${{ steps.keystore.outputs.path }}
          MASRAH_KEYSTORE_PASSWORD: ${{ secrets.MASRAH_KEYSTORE_PASSWORD }}
          MASRAH_KEY_ALIAS: masrah
        run: |
          # نسختين بقصد.
          #
          # النسخة الموحّدة جوّاها مكتبات تلات معماريات (arm64 و arm و x86_64)،
          # وهي اللي مطلّعة الملف ٦١ ميجا — والتليفون مش هيشغّل منهم غير
          # واحدة. تليفون مساحته ضيّقة بيرفض التثبيت، ورسالة أندرويد ساعتها
          # مابتقولش السبب، واللي بيحصل إن اللاعب بيفتكر النسخة بايظة.
          #
          # فـ arm64 هي اللي بتتحط أول الإصدار: بتغطّي أي تليفون من ٢٠١٦
          # وطالع، وحجمها حوالي النص. والموحّدة بتفضل تحتها لأي حالة غريبة.
          flutter build apk --release --split-per-abi \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ github.run_number }}"
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ github.run_number }}"

      # البصمة بتتطبع في كل بناء عشان تتقارن باللي في assetlinks.json من غير
      # ما حد يفك الـAPK بإيده.
      - name: بصمة التوقيع
        run: |
          APK=apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" \
            | grep -i "SHA-256" || true

      - name: تجهيز الملفات
        id: files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OUT=apps/mobile/build/app/outputs/flutter-apk
          mkdir -p dist
          cp "$OUT/app-arm64-v8a-release.apk"   "dist/masrah-$VERSION-arm64.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "dist/masrah-$VERSION-arm32.apk"
          cp "$OUT/app-release.apk"             "dist/masrah-$VERSION-all.apk"
          ( cd dist && sha256sum ./*.apk > SHA256SUMS.txt )
          # الأحجام بتتكتب في وصف الإصدار: السؤال «هيحتاج كام مساحة» هو
          # نفسه سبب فشل التثبيت، وإجابته لازم تبقى مكتوبة قبل التنزيل.
          for k in arm64 arm32 all; do
            size=$(du -h --apparent-size "dist/masrah-$VERSION-$k.apk" | cut -f1)
            echo "$k=$size" >> "$GITHUB_OUTPUT"
          done
          ls -la dist

      # نسخة تانية من نفس الملف كـ artifact. الإصدار مسوّدة، وتنزيل ملف من
      # مسوّدة بيتطلب تسجيل دخول بحساب له صلاحية كتابة — وده بيمنع أي أداة
      # آلية إنها تجيب الملف وتسلّمه. الـ artifact بيتجاب بالـ API، فينفع
      # يتبعت مباشرة من غير ما حد يفتح المتصفح.
      - name: رفع الـ APK كـ artifact
        uses: actions/upload-artifact@v4
        with:
          name: masrah-apk-${{ steps.version.outputs.version }}
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: تجهيز وصف الإصدار
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          printf '## مسرح الجريمة %s\n' "$VERSION" > release-body.md
          {
            printf '\n### نزّل إيه\n\n'
            printf '**`masrah-%s-arm64.apk` (%s)** — دي اللي تاخدها. بتشتغل على أي\n' \
              "$VERSION" "${{ steps.files.outputs.arm64 }}"
            printf 'تليفون من ٢٠١٦ وطالع.\n\n'
            printf -- '- `masrah-%s-arm32.apk` (%s) — لو التليفون قديم ورفض اللي فوق.\n' \
              "$VERSION" "${{ steps.files.outputs.arm32 }}"
            printf -- '- `masrah-%s-all.apk` (%s) — بتشتغل على أي حاجة، بس حجمها\n' \
              "$VERSION" "${{ steps.files.outputs.all }}"
            printf '  الضعف. خدها بس لو التانيين ما زبطوش.\n\n'
            printf '> التحديث بيتسطّب فوق القديم من غير مسح: كل البناءات موقّعة\n'
            printf '> بنفس مفتاح النشر. بس **لازم تفضل على نفس النوع** — اللي عنده\n'
            printf '> arm64 يحدّث بـ arm64؛ التبديل بين نوع ونوع بيتطلب مسح وتسطيب.\n\n'
            printf -- '---\n\n### الملفات\n\n'
            printf '```\n'; sed 's|\./||' dist/SHA256SUMS.txt; printf '```\n\n'
            printf '_بُني من الريبو الخاص `EGYFIRE/Masrah` عند `%s` (`%s`) — بناء رقم %s._\n' \
              "${{ inputs.ref }}" "${{ steps.version.outputs.sha }}" "${{ github.run_number }}"
          } >> release-body.md

      - name: نشر الإصدار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "مسرح الجريمة — إصدار v${{ steps.version.outputs.version }} (بناء ${{ github.run_number }})"
          body_path: release-body.md
          files: dist/*
          fail_on_unmatched_files: true
          # مسوّدة: الملفات لا تظهر لأحد إلا لأصحاب صلاحية الكتابة على الريبو.
          # الريبو عام ليأخذ دقائق Actions المجانية، لا لينشر النسخ للعامة.
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
