name: إسلام صبحي — الأدمن

# السورس خاص في EGYFIRE/islam-admin ولا يُبنى هناك أبدًا (الريبوهات الخاصة تشترك في 2000 دقيقة/شهر).
# البناء هنا (ريبو عام = دقائق مجانية)، والناتج Release بتاج يبدأ بـ islam-admin-.
#
# إعدادات المشروع كما هي في السورس (للمرجع):
#   pubspec: sdk '>=2.18.6 <3.0.0'  →  لازم Dart 2.x  →  Flutter 3.7.12 (Dart 2.19.6)
#   .metadata revision 135454af… (قناة stable، عائلة 3.7)
#   android/build.gradle: AGP 7.1.2 · Kotlin 1.6.10 · google-services 4.3.15
#   gradle-wrapper: Gradle 7.4      →  الأنسب JDK 11 (AGP 7.1 مش مدعوم رسميًا على 17)
#   android/app/build.gradle: أسلوب قديم (apply from flutter.gradle) · compileSdk 33
#                             minSdkVersion flutter.minSdkVersion (=16 في 3.7) → يُرفع لـ21 وقت البناء
#   يستخدم plugin com.google.gms.google-services → محتاج google-services.json (غير موجود في الريبو)
#
# التوقيع: الـAPK موقّع بمفتاح debug. افتراضيًا يتولّد مفتاح جديد كل بناء، وده
# معناه إن كل نسخة مش هتتثبت فوق اللي قبلها. لتثبيت مفتاح واحد دائم، جهّز مخزنًا
# مرة واحدة على جهازك:
#   keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
#     -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
#     -dname "CN=Android Debug,O=Android,C=US"
#   base64 -w0 debug.keystore
# وحُط الناتج في secret على all-pro اسمه ANDROID_DEBUG_KEYSTORE_B64.
# (كلمة المرور والـalias لازم يفضلوا بالقيم القياسية اللي فوق.)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "الفرع أو الكوميت في الريبو الخاص (فاضي = الفرع الافتراضي)"
        required: false
        default: ""
      flutter_version:
        description: "نسخة Flutter"
        required: false
        default: "3.7.12"
      java_version:
        description: "نسخة Java"
        required: false
        default: "11"

permissions:
  contents: write

jobs:
  build:
    name: بناء إسلام صبحي — الأدمن
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source (private repo)
        uses: actions/checkout@v4
        with:
          repository: EGYFIRE/islam-admin
          ref: ${{ inputs.ref || '' }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: كشف بيانات المشروع
        id: detect
        run: |
          set -e
          echo "--- pubspec environment ---"; sed -n '/^environment:/,/^$/p' pubspec.yaml || true
          echo "--- .metadata ---"; sed -n '1,12p' .metadata 2>/dev/null || true
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//' | tr -d ' \r')
          [ -z "$VERSION" ] && VERSION="0.0.0"
          APPID=$(grep -m1 'applicationId' android/app/build.gradle | sed -E 's/.*applicationId[[:space:]]*"([^"]+)".*/\1/')
          [ -z "$APPID" ] && APPID="com.apps.ssdco.school"
          {
            echo "version=$VERSION"
            echo "appid=$APPID"
            echo "tag=islam-admin-v$VERSION-${{ github.run_number }}"
          } >> "$GITHUB_OUTPUT"
          echo "Version=$VERSION  applicationId=$APPID"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ inputs.java_version || '11' }}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '3.7.12' }}
          channel: stable
          cache: true

      # ===== تعديلات وقت البناء فقط — لا تُدفع لأي مستودع =====

      - name: توفير google-services.json (سبب فشل البناء السابق)
        env:
          GS_JSON_B64: ${{ secrets.ISLAM_ADMIN_GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          TARGET=android/app/google-services.json
          if [ -f "$TARGET" ]; then
            echo "الملف موجود في السورس — لا حاجة لأي شيء."
          elif [ -n "$GS_JSON_B64" ]; then
            printf '%s' "$GS_JSON_B64" | base64 -d > "$TARGET"
            echo "استُخدم google-services.json الحقيقي من الـ secret."
          else
            APPID='${{ steps.detect.outputs.appid }}'
            cat > "$TARGET" <<JSON
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "islam-admin-placeholder",
              "storage_bucket": "islam-admin-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "$APPID" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
            echo "::warning::google-services.json غير موجود في السورس ولا في secrets — استُخدم ملف وهمي."
            echo "::warning::الـAPK هيتبني ويتثبت، لكن خدمات Firebase (تسجيل الدخول/Firestore) مش هتشتغل."
            echo "::warning::لتفعيلها: ضيف secret اسمه ISLAM_ADMIN_GOOGLE_SERVICES_JSON بمحتوى الملف الحقيقي مشفّر base64."
          fi

      - name: رفع minSdkVersion إلى 21
        run: |
          set -e
          # Flutter 3.7 بيحطّ flutter.minSdkVersion = 16، وplugins الـFirebase محتاجة 19+
          sed -i -E 's/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
          grep -n 'minSdkVersion' android/app/build.gradle

      - name: تجهيز مفتاح التوقيع (وقت البناء فقط)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -e
          mkdir -p "$HOME/.android"
          KS="$HOME/.android/debug.keystore"

          # مخزن المفاتيح دايمًا في مسار الـdebug القياسي، عشان يشتغل مع
          # المشاريع اللي بتستخدم signingConfigs.debug ومع اللي بتقرا key.properties.
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "استُخدم مخزن مفاتيح ثابت من الـsecret — التوقيع هيفضل نفسه في كل بناء."
          else
            keytool -genkeypair -v -keystore "$KS" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null
            echo "::warning::لا يوجد secret باسم ANDROID_DEBUG_KEYSTORE_B64، فتولّد مفتاح debug جديد لهذا البناء."
            echo "::warning::معناها إن الـAPK ده مش هيتثبت فوق أي نسخة مثبتة قبل كده (توقيع مختلف) — لازم إلغاء التثبيت أولًا."
            echo "::warning::لتثبيت مفتاح واحد لكل البناءات، أضف الـsecret كما هو موضّح في تعليقات الـworkflow."
          fi

          keytool -list -keystore "$KS" -storepass android -alias androiddebugkey \
            | sed -n 's/.*SHA-256: */بصمة التوقيع SHA-256: /p' || true

          # المشاريع اللي بتقرا key.properties محتاجة الملف ده
          GP=android/app/build.gradle
          [ -f "$GP" ] || GP=android/app/build.gradle.kts
          if grep -q 'key.properties' "$GP" 2>/dev/null && [ ! -f android/key.properties ]; then
            {
              echo "storePassword=android"
              echo "keyPassword=android"
              echo "keyAlias=androiddebugkey"
              echo "storeFile=$KS"
            } > android/key.properties
            echo "أُنشئ key.properties مؤقت يشير لنفس المخزن."
          fi

      # ===== البناء =====

      - name: flutter pub get
        run: |
          flutter --version
          flutter pub get

      - name: بناء APK (release موقّع بمفتاح debug · arm64-v8a فقط)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: تجهيز الملف
        run: |
          set -e
          rm -rf dist && mkdir -p dist
          APK=$(find build/app/outputs -name 'app-arm64-v8a-release.apk' | head -1)
          if [ -z "$APK" ]; then echo '::error::لم يُعثر على APK الخاص بـ arm64-v8a'; find build/app/outputs -name '*.apk'; exit 1; fi
          cp "$APK" "dist/islam-admin-${{ steps.detect.outputs.version }}-arm64-v8a-release.apk"
          ls -la dist
          echo "size=$(du -h dist/*.apk | cut -f1)" >> "$GITHUB_OUTPUT"
        id: pack

      - name: تجهيز وصف الإصدار
        run: |
          {
            printf '## إسلام صبحي — الأدمن — إصدار تجريبي\n\n'
            printf '> نسخة **release** موقّعة بمفتاح **debug** مؤقت — للتجربة والتثبيت المباشر فقط، غير صالحة لـ Google Play.\n\n'
            printf -- '- النسخة: `%s`\n' "${{ steps.detect.outputs.version }}"
            printf -- '- المعمارية: `arm64-v8a` (أجهزة 64-بت الحديثة)\n'
            printf -- '- الحجم: `%s`\n' "${{ steps.pack.outputs.size }}"
            printf -- '- Flutter: `%s` · Java: `%s`\n' "${{ inputs.flutter_version || '3.7.12' }}" "${{ inputs.java_version || '11' }}"
          } > release-body.md

      - name: نشر الإصدار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.detect.outputs.tag }}
          name: "إسلام صبحي — الأدمن — تجريبي v${{ steps.detect.outputs.version }} (بناء ${{ github.run_number }})"
          body_path: release-body.md
          files: dist/*.apk
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
