name: إسلام صبحي — الأدمن

# السورس خاص في Kartonaa/islam-admin ولا يُبنى هناك أبدًا (الريبوهات الخاصة تشترك في 2000 دقيقة/شهر).
# البناء هنا (ريبو عام = دقائق مجانية)، والناتج Release بتاج يبدأ بـ islam-admin-.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "الفرع أو الكوميت في الريبو الخاص (فاضي = الفرع الافتراضي)"
        required: false
        default: ""
      flutter_version:
        description: "نسخة Flutter (فاضي = تُكتشف من المشروع)"
        required: false
        default: ""
      java_version:
        description: "نسخة Java"
        required: false
        default: "17"

permissions:
  contents: write

jobs:
  build:
    name: بناء إسلام صبحي — الأدمن
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source (private repo)
        uses: actions/checkout@v4
        with:
          repository: Kartonaa/islam-admin
          ref: ${{ inputs.ref || '' }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: كشف إعدادات المشروع
        id: detect
        run: |
          echo "--- pubspec environment ---"; sed -n '/^environment:/,/^[a-z]/p' pubspec.yaml || true
          echo "--- .metadata ---"; cat .metadata 2>/dev/null || true
          FV="${{ inputs.flutter_version }}"
          if [ -z "$FV" ]; then
            FV=$(grep -E '^\s+flutter:' pubspec.yaml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          fi
          if [ -z "$FV" ]; then FV="3.10.6"; echo "لم تُحدَّد نسخة Flutter في pubspec — استخدام $FV"; fi
          echo "flutter=$FV" >> "$GITHUB_OUTPUT"
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:\s*//; s/\+.*//' | tr -d ' \r')
          [ -z "$VERSION" ] && VERSION="0.0.0"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=islam-admin-v$VERSION-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Flutter=$FV  Version=$VERSION"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ inputs.java_version }}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.detect.outputs.flutter }}
          channel: stable
          cache: true

      - name: تعطيل متطلبات مفتاح النشر مؤقتًا (وقت البناء فقط)
        run: |
          # لو build.gradle بيقرأ key.properties، نوفّر ملفًا يشير لمخزن الـ debug
          GP=android/app/build.gradle
          [ -f "$GP" ] || GP=android/app/build.gradle.kts
          if grep -q 'key.properties' "$GP" 2>/dev/null && [ ! -f android/key.properties ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
            {
              echo "storePassword=android"
              echo "keyPassword=android"
              echo "keyAlias=androiddebugkey"
              echo "storeFile=$HOME/.android/debug.keystore"
            } > android/key.properties
            echo "أُنشئ key.properties مؤقت بمفتاح debug (لا يُرفع لأي مكان)."
          fi

      - name: flutter pub get
        run: flutter pub get

      - name: بناء APK (debug signing)
        run: flutter build apk --debug

      - name: تجهيز الملفات
        run: |
          mkdir -p dist
          cp $(find build/app/outputs -name '*.apk' | head -1) "dist/islam-admin-${{ steps.detect.outputs.version }}-debug.apk"
          ( cd dist && sha256sum ./*.apk > SHA256SUMS.txt )
          ls -la dist

      - name: تجهيز وصف الإصدار
        run: |
          {
            printf '## إسلام صبحي — الأدمن — إصدار تجريبي\n\n'
            printf '> **APK موقّع بمفتاح debug** — للتجربة والتثبيت المباشر فقط، غير صالح لـ Google Play.\n\n'
            printf -- '- المصدر: `Kartonaa/islam-admin`\n'
            printf -- '- الفرع/المرجع: `%s`\n' "${{ inputs.ref }}"
            printf -- '- الكوميت: `%s`\n' "$(git rev-parse HEAD)"
            printf -- '- Flutter: `%s` · Java: `%s`\n\n' "${{ steps.detect.outputs.flutter }}" "${{ inputs.java_version }}"
            printf '```\n'; sed 's|\./||' dist/SHA256SUMS.txt; printf '```\n'
          } > release-body.md

      - name: نشر الإصدار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.detect.outputs.tag }}
          name: "إسلام صبحي — الأدمن — تجريبي v${{ steps.detect.outputs.version }} (بناء ${{ github.run_number }})"
          body_path: release-body.md
          files: dist/*
          fail_on_unmatched_files: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
