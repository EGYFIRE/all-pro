name: حماية الإصدارات (إخفاء وتنظيف)

# الريبو ده عام عشان دقائق Actions المجانية، مش عشان النسخ تكون متاحة للكل.
# الـ workflow ده بيحوّل إصدارات مشروع معيّن لمسوّدات (ما تظهرش إلا لصاحب الريبو)،
# ويقدر كمان يمسح ملفات الإصدارات الأقدم عشان ما تفضلش متاحة بروابطها القديمة.
#
# التشغيل: Actions ← حماية الإصدارات ← Run workflow، وحدّد بادئة التاج.

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "بادئة التاج — qutoof- أو apk-v أو build-"
        required: true
        type: string
      mode:
        description: "draft = إخفاء فقط · purge = إخفاء + مسح ملفات الإصدارات الأقدم"
        required: true
        default: draft
        type: choice
        options:
          - draft
          - purge
      keep:
        description: "كم إصدارًا أحدث تحتفظ بملفاته (مع purge)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: إخفاء الإصدارات وتنظيف ملفاتها
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PREFIX: ${{ inputs.prefix }}
          MODE: ${{ inputs.mode }}
          KEEP: ${{ inputs.keep }}
        run: |
          set -euo pipefail

          if [ -z "${PREFIX// }" ]; then
            echo "::error::لازم تحدّد بادئة التاج."
            exit 1
          fi

          # الأحدث أولًا — بترتيب رقم الإصدار (id) لأنه تصاعدي دائمًا.
          #
          # لا تستعمل createdAt هنا: هو تاريخ الـ commit الذي يشير إليه التاج، وكل التاجات
          # هنا تشير إلى نفس الـ commit تقريبًا، فيخرج الترتيب عشوائيًا و"احتفظ بأحدث N"
          # تُبقي إصدارًا قديمًا وتمسح ملفات الأحدث.
          gh api "repos/$REPO/releases?per_page=100" --paginate \
            --jq "[.[] | select(.tag_name | startswith(\"$PREFIX\"))]
                  | sort_by(.id) | reverse | .[].tag_name" > tags.txt

          count=$(wc -l < tags.txt | tr -d ' ')
          if [ "$count" = "0" ]; then
            echo "::warning::لا توجد إصدارات ببادئة $PREFIX"
            exit 0
          fi
          echo "عدد الإصدارات المطابقة: $count"

          index=0
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            index=$((index + 1))

            gh release edit "$tag" --repo "$REPO" --draft=true >/dev/null
            echo "✅ $tag — صار مسوّدة"

            if [ "$MODE" = "purge" ] && [ "$index" -gt "$KEEP" ]; then
              gh release view "$tag" --repo "$REPO" --json assets --jq '.assets[].name' \
                | while IFS= read -r asset; do
                    [ -n "$asset" ] || continue
                    gh release delete-asset "$tag" "$asset" --repo "$REPO" --yes
                    echo "   🗑️  اتمسح: $asset"
                  done
            fi
          done < tags.txt

          echo
          echo "الحالة بعد التنفيذ:"
          gh release list --repo "$REPO" --limit 200
