name: Build Windows EXE (كاشير المطعم الاحترافي)

on:
  workflow_dispatch:
    inputs:
      ref:
        # ⚠️⚠️ الافتراضي ده تسبب في مشكلة خطيرة: كل بناء اتعمل من غير ما
        # يتبعت ref صراحةً كان بيبني الفرع ده - يعني ٦٩ commit من الشغل
        # الفعلي مكانوش في أي نسخة اتبعتت للمستخدم، وهو شايف واجهة قديمة
        # ومصدّق إن التحديثات مش شغّالة. **ابعت ref صراحةً دايماً.**
        description: "الفرع أو الكوميت في الريبو الخاص المطلوب بناؤه - ابعته صراحةً!"
        required: true
        default: "claude/handover-docs-review-iuxuyy"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source (private repo)
        uses: actions/checkout@v4
        with:
          repository: EGYFIRE/App-exe-pc
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # ⚠️ رقم الإصدار في package.json ثابت (0.9.0) ومابيتغيّرش مع كل بناء،
      # فمكانش فيه أي طريقة يعرف بيها المستخدم أنهي نسخة شغّالة عنده. الملف
      # ده بيتحفر هنا وبيظهر في شاشة الإعدادات كـ"رقم البناء".
      # (بنكتب ملف بيانات منفصل بدل ما نلمس version في package.json - لمس
      # version بصيغة زي "0.9.0+build.24" ممكن يكسر مثبّت NSIS اللي بيحتاج
      # نسخة رقمية بحتة.)
      - name: Stamp build info
        run: |
          node -e "
            const fs=require('fs');
            fs.writeFileSync('electron/build-info.json', JSON.stringify({
              buildNumber: process.env.RUN_NUMBER,
              builtAt: new Date().toISOString().slice(0,16).replace('T',' ') + ' UTC'
            }, null, 2));
            console.log(fs.readFileSync('electron/build-info.json','utf8'));
          "
        env:
          RUN_NUMBER: ${{ github.run_number }}

      - name: Build Windows installer + portable exe
        run: npx electron-builder --win nsis portable --publish never

      - name: Create GitHub Release with EXE files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "Apaza - بناء رقم ${{ github.run_number }}"
          body: "تحميل مباشر لملف تثبيت الكاشير (Setup) والنسخة المحمولة لويندوز."
          files: |
            dist/*.exe
          fail_on_unmatched_files: true
          # مسوّدة: الريبو عام ليأخذ دقائق Actions المجانية، لا لينشر النسخ للعامة.
          # الملفات لا يراها ولا يحمّلها إلا صاحب الريبو وهو مسجّل دخول.
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
