name: Build Windows EXE (صابر — نظام إدارة المتاجر)

on:
  workflow_dispatch:
    inputs:
      ref:
        # ⚠️ لا تعتمد على القيمة الافتراضية. حصل في build-windows.yml أن بناءً
        # اعتمد عليها فأنتج نسخة أقدم بـ٦٩ كوميت، وظل المستخدم يبلّغ عن عيوب
        # مُصلَحة وهو يرى واجهة قديمة. **اكتب الفرع صراحةً في كل تشغيل.**
        description: "الفرع أو الكوميت في EGYFIRE/Aswaq-exe — اكتبه صراحةً!"
        required: true
        default: "claude/analyze-exe-competition-qsw28d"

permissions:
  contents: write

# بناءان متزامنان للمشروع نفسه يهدران الوقت ويربكان ترقيم الإصدارات.
concurrency:
  group: saber-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source (private repo)
        uses: actions/checkout@v4
        with:
          repository: EGYFIRE/Aswaq-exe
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      # أول بناء فشل لأن مجلد الواجهة كان اسمه dist فطابق قاعدة في .gitignore
      # ولم يُرفع إلى الريبو أصلاً. البناء المحلي نجح لأن الملفات على قرص
      # المطوّر، والفشل ظهر هنا فقط — برسالة panic من ماكرو لا تقول السبب.
      # هذه الخطوة تمسكها مبكراً برسالة مفهومة.
      - name: Verify the interface is present
        shell: pwsh
        run: |
          $ui = "apps/desktop/ui"
          foreach ($f in @("index.html", "app.css", "app.js")) {
            if (-not (Test-Path "$ui/$f")) {
              Write-Host "::error::ملف الواجهة $ui/$f غير موجود في الريبو. تأكد أنه ليس مستبعداً في .gitignore."
              exit 1
            }
          }
          Write-Host "ملفات الواجهة موجودة."

      # حارس الواجهة: يفتح كل شاشة ويضغط كل زر في بيئة مُقلَّدة. عطبٌ في
      # JavaScript لا يكسر الترجمة، فلولا هذه الخطوة لخرج ملفٌ يُترجَم تماماً
      # وتنهار شاشته عند أول ضغطة.
      - name: Check the interface runs
        run: node tools/check-ui.js

      # الكوميت الذي يُعلَن في الإصدار يجب أن يكون كوميت **السورس**، لا كوميت
      # all-pro: الأخير لا يقول شيئاً عن النسخة التي بين يدي المستخدم، وإعلانه
      # يجعل تتبّع أي عيب مستحيلاً.
      - name: Record the source commit
        id: src
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          "sha=$sha"                     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "short=$($sha.Substring(0,8))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # الواجهة ملفات ثابتة تُدمَج داخل الملف التنفيذي وقت الترجمة، فلا حاجة
      # إلى Node ولا إلى خطوة بناء أمامية ولا إلى مثبّت منفصل: الناتج ملف
      # واحد يعمل بالنقر المزدوج.
      #
      # SABER_BUILD يُحفر داخل التطبيق ويظهر تحت الاسم، فيعرف المستخدم أي
      # نسخة تعمل عنده بدل أن يخمّن.
      #
      # SABER_LICENCE_SECRET سرّ توقيع مفاتيح التراخيص. إن لم يُضبَط في أسرار
      # الريبو فالسرّ الافتراضي المكتوب في المصدر. المهم أن يطابق ما تُشغّل به
      # أداة الصكّ، وإلا رفض البرنامجُ كلَّ مفتاح تصكّه.
      - name: Build Windows executable
        working-directory: apps/desktop/src-tauri
        env:
          SABER_BUILD: ${{ github.run_number }}
          SABER_LICENCE_SECRET: ${{ secrets.SABER_LICENCE_SECRET }}
        run: cargo build --release --bin saber-desktop

      # أداتان من مساحة العمل الرئيسية لا من مساحة Tauri المستقلة:
      #   keygen — تبقى عندك أنت لا مع من تُرسل له البرنامج.
      #   rescue — تُرسَل مع البرنامج: من نسي كلمته يجب أن يعود إلى دفاتره.
      - name: Build the side tools
        env:
          SABER_LICENCE_SECRET: ${{ secrets.SABER_LICENCE_SECRET }}
        run: cargo build --release --bin saber-keygen --bin saber-rescue

      - name: Package
        shell: pwsh
        run: |
          $out = "release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "apps/desktop/src-tauri/target/release/saber-desktop.exe" "$out/Saber.exe"
          Copy-Item "target/release/saber-rescue.exe" "$out/saber-rescue.exe"
          $mb = [math]::Round((Get-Item "$out/Saber.exe").Length / 1MB, 1)
          Write-Host "حجم الملف: $mb MB"

          $readme = @"
          صابر — نظام إدارة المتاجر
          =========================
          بناء رقم ${{ github.run_number }} · ${{ steps.src.outputs.short }}

          التشغيل
          -------
          انقر مرتين على Saber.exe — لا يحتاج تثبيت ولا إنترنت.
          أول مرة: اكتب اسم منشأتك، ثم أنشئ حساب المالك بكلمة مرور.

          المتطلبات
          ---------
          ويندوز 10 أو 11 (64-بت). يستخدم WebView2 المثبّت أصلاً مع ويندوز
          10 و11. إن لم يفتح على نسخة قديمة، ثبّت مجاناً:
          Microsoft Edge WebView2 Runtime.

          بياناتك
          -------
          تُحفظ في ملف على جهازك ويبقى بعد الإغلاق. مساره مكتوب داخل البرنامج
          في: الإعدادات ← عن البرنامج. البرنامج يفتح فارغاً تماماً — لا أصناف
          تجريبية ولا فواتير — وتبدأ أنت بإدخال أصنافك.
          خذ نسخة احتياطية من: الإعدادات ← النسخ الاحتياطي.

          نسيت كلمة المرور؟
          -----------------
          شغّل saber-rescue.exe الموجود بجوار البرنامج. يعرض أسماء الدخول
          المسجّلة (إن نسيت الاسم أيضاً) ويضع كلمة جديدة لمن تختار.

          الكلمة القديمة لا تُسترجَع ولا تُعرَض: هي مُلبَّدة في القاعدة ولا
          يملك أحد ردّها — ولو أمكن ردُّها لكانت بلا قيمة أصلاً.

          الترخيص
          -------
          إن وصلك مفتاح مع البرنامج: افتح الإعدادات ← الترخيص، الصق المفتاح،
          واضغط «فعّل المفتاح». يرتبط بجهازك هذا ولا يعمل على غيره، ويبقى بعد
          حذف البرنامج وإعادة تثبيته.
          وإن لم يصلك مفتاح فلك أسبوع من أول تشغيل.

          بعد انتهاء المدّة يبقى كل شيء معروضاً وقابلاً للطباعة ولأخذ نسخة
          احتياطية، ويتوقّف البيع والشراء والترحيل وحدها — بياناتك لا تُحتجز
          عنك أبداً.

          ماذا يعمل
          ---------
          - لوحة تحكم: مبيعات اليوم وربحه، النقدية، قيمة المخزون، ما لك عند
            العملاء وما عليك للموردين، ورسم آخر سبعة أيام
          - نقطة بيع: باركود (امسح ثم Enter)، بحث، نقدي/شبكة/آجل
          - مشتريات: فاتورة مورد بسعر شراء لكل سطر، وتسعير الصنف في الخطوة نفسها
          - أصناف بمجموعات وتصفية وتحديد جماعي، ومخازن متعدّدة ونقل بينها
          - جرد: ورقة تُفتح وتُعدّ وتُرحَّل، والفرق يذهب لحساب تسوية مستقل
          - سندات قبض وصرف تُطفئ أقدم فاتورة مفتوحة أولاً
          - عملاء وموردون بأرصدة وكشف حساب يُطبع
          - مرتجعات في الاتجاهين، بتكلفتها الأصلية لا بمتوسط اليوم
          - مستخدمون بثلاثة أدوار، وورديات بمطابقة الدرج عند الإقفال
          - تقارير: قائمة دخل، أرباح الأصناف، أعمار الديون، إقرار الضريبة،
            وميزان مراجعة يتحقّق من توازنه أمامك
          - استيراد الأصناف من CSV بمعاينة كاملة قبل الكتابة
          - نسخ احتياطي واستعادة، مع نسخة أمان تلقائية قبل كل استعادة
          - رمز ضريبي حقيقي (المرحلة الأولى) يقرؤه تطبيق «فاتورة» في السعودية
          - طباعة على قصاصة 80مم أو ورقة A4
          - بحث شامل من الشريط العلوي: صنف أو فاتورة أو عميل — Ctrl+K
          - سمة ليلية ونهارية

          ما لم يُبنَ بعد
          ---------------
          - المرحلة الثانية من الفوترة الإلكترونية (توقيع وربط مباشر بالهيئة)
          - الربط بمنظومة الفاتورة الإلكترونية المصرية
          - الموقع وتطبيق أندرويد
          - العرض بالإنجليزية
          "@
          [System.IO.File]::WriteAllText("$out/اقرأني.txt", $readme, [System.Text.UTF8Encoding]::new($true))

          # أداة الصكّ ودليلها يخرجان في ملف منفصل: لا يجوز أن يصلا مع النسخة
          # المُرسَلة للتجربة، وإلا صكّ كلُّ مجرِّبٍ مفتاحه بنفسه.
          $keys = "keytool"
          New-Item -ItemType Directory -Force -Path $keys | Out-Null
          Copy-Item "target/release/saber-keygen.exe" "$keys/saber-keygen.exe"

          $howto = @"
          صكّ مفاتيح التراخيص — للمطوّر وحده
          ===================================
          بناء رقم ${{ github.run_number }} · ${{ steps.src.outputs.short }}

          ⚠️ لا تُرسل هذا الملف مع البرنامج. من يملك هذه الأداة يصكّ لنفسه.

          الطريقة — انقر مرّتين
          ---------------------
          انقر مرّتين على saber-keygen.exe. تفتح نافذة سوداء تسألك سؤالين:
          كم يوماً (Enter = ٧)، وهل تريد ربطه بجهاز بعينه (Enter = لا).
          ثم تطبع المفتاح وتنتظر حتى تضغط Enter.

          أو من موجّه الأوامر مباشرةً:

                saber-keygen.exe --days 7

          خذ المفتاح وأرسله مع البرنامج. يفتحه الزميل من:
          الإعدادات ← الترخيص، يلصقه، ويضغط «فعّل المفتاح». خلاص.

          ما الذي تفعله هذه الأداة بجهازك؟
          --------------------------------
          لا شيء. ملف واحد لا يُثبَّت ولا يكتب ملفاً ولا يلمس سجلّ النظام ولا
          يتّصل بالإنترنت: يقرأ ما تكتبه، يحسب المفتاح، يطبعه، وينتهي.

          المفتاح يلتقط أوّل جهاز يُفعَّل عليه ثم لا يعمل على غيره.
          اصكّ مفتاحاً لكل زميل: لكل مفتاح مسلسل يميّزه.

          الخيارات
          --------
          --days,    -d   عدد الأيام. صفر = ترخيص دائم بلا انتهاء
          --machine, -m   لربط المفتاح بجهاز بعينه مقدّماً (كود الجهاز يظهر
                          للزميل في: الإعدادات ← الترخيص). نادراً ما تحتاجه
          --check,   -c   يقرأ مفتاحاً موجوداً ويقول ما فيه بدل صكّ جديد
          --help,    -h   الشرح كاملاً

          ملاحظات
          -------
          - مدّة المفتاح الطليق تُعدّ من **يوم صكّه** لا من يوم تفعيله: مفتاح
            أسبوعٍ صُكّ الإثنين ينتهي الإثنين التالي عند الجميع. لا تصكّ
            مفاتيح مقدّماً وتخزّنها.
          - المفتاح يُسقط مهلة الأسبوع ولا يُضاف إليها. ومفتاح انتهت مدّته
            يُرفَض ولا يُحفَظ، فلا يخسر الزميل مهلته بلصق مفتاح ميّت.
          - لترخيص جهازك أنت بلا انتهاء: خذ كود جهازك من الإعدادات ثم
                saber-keygen.exe --machine <كودك> --days 0
            (دائم **بلا** --machine خطر: أوّل من يُفعّله يملكه إلى الأبد.)

          حدود الحماية — بصراحة
          ---------------------
          المفتاح يمنع: تأليف مفتاح من العدم، وتعديل حروفه لتمديد المدّة،
          ونقل نسخةٍ مُفعَّلة إلى جهاز آخر، وإرجاع ساعة الجهاز، وحذف ملفات
          البرنامج لتصفير المهلة.

          ولا يمنع أمرين:
          1. زميلٌ يعيد إرسال المفتاح إلى ثالثٍ لم يُركِّب البرنامج قطّ —
             سيعمل عنده. لا شيء على جهازه يعلم أن المفتاح استُهلك، وذلك
             يحتاج تفعيلاً عبر خادم يفرض إنترنتاً. لكنه يرث ما تبقّى من
             المدّة لا مدّةً جديدة، فالثمرة قليلة.
          2. من يفكّك الملف التنفيذي ويستخرج السرّ يصكّ لنفسه. هذه بوّابة
             تجربة لزميل، لا حماية ضد خصم مصمِّم.
          "@
          [System.IO.File]::WriteAllText("$keys/كيف-تصكّ-مفتاحاً.txt", $howto, [System.Text.UTF8Encoding]::new($true))

          Compress-Archive -Path "$out/*"  -DestinationPath "Saber-Windows.zip"      -Force
          Compress-Archive -Path "$keys/*" -DestinationPath "Saber-KeyTool.zip"      -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: saber-${{ github.run_id }}
          name: "صابر — بناء رقم ${{ github.run_number }}"
          body: |
            نظام إدارة المتاجر لويندوز 64-بت.

            **للاستعمال:** فك ضغط `Saber-Windows.zip` ثم انقر مرتين على `Saber.exe`.
            لا يحتاج تثبيت ولا إنترنت. أسبوع من أول تشغيل بلا مفتاح، وبعدها
            يعرض ويطبع ويأخذ نسخة احتياطية ولا يبيع.
            وبجواره `saber-rescue.exe` لمن نسي كلمة مروره.

            **لك وحدك:** `Saber-KeyTool.zip` فيه أداة صكّ المفاتيح.
            `saber-keygen.exe --days 7` يعطيك مفتاحاً ترسله مع البرنامج مباشرةً
            بلا سؤال عن كود جهاز. لا تُرسل الأداة نفسها مع البرنامج.

            المصدر: `EGYFIRE/Aswaq-exe@${{ inputs.ref }}`
            الالتزام: `${{ steps.src.outputs.sha }}`
          files: |
            Saber-Windows.zip
            Saber-KeyTool.zip
          fail_on_unmatched_files: true
          # مسوّدة: الريبو عام ليأخذ دقائق Actions المجانية، لا لينشر النسخ للعامة.
          # الملفات لا يراها ولا يحمّلها إلا صاحب الريبو وهو مسجّل دخول.
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
