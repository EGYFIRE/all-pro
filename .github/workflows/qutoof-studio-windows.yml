name: Build Qutoof Studio (Windows)

# سورس «ستديو قطوف» خاص في EGYFIRE/Motion-Graphics ولا يُبنى هناك أبدًا (دقائق الريبوهات الخاصة محدودة).
# البناء هنا (ريبو عام = دقائق مجانية)، والناتج (zip للويندوز فيه البرنامج + محتوى تجريبي)
# بيتنشر كـ Release مسوّدة بتاج يبدأ بـ qutoof-studio-.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "الفرع أو الكوميت في EGYFIRE/Motion-Graphics"
        required: false
        default: "claude/small-loop-3d-code-6d0omq"

permissions:
  contents: write

jobs:
  build:
    name: بناء ستديو قطوف (ويندوز)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source (private repo)
        uses: actions/checkout@v4
        with:
          repository: EGYFIRE/Motion-Graphics
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          sparse-checkout: |
            qutoof-studio
            sadiq-amin
            assets/fonts

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: تثبيت الأدوات (Electron + ffmpeg + three)
        working-directory: qutoof-studio
        run: npm ci --no-audit --no-fund

      - name: بناء النسخة (zip)
        working-directory: qutoof-studio
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: الملفات (كامل أول مرة + تحديث صغير + المحتوى)
        id: v
        shell: bash
        run: |
          set -euo pipefail
          V=$(node -p "require('./qutoof-studio/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=qutoof-studio-v$V-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          mkdir -p out
          # كامل: أول مرة بس (Electron + ffmpeg مابيتغيروش)
          mv "qutoof-studio/dist/Qutoof Studio-$V-win.zip" "out/QutoofStudio-$V-full-win.zip"
          # تحديث صغير: كود البرنامج + three.js — بيتفك فوق النسخة الموجودة
          cd qutoof-studio/dist/win-unpacked
          7z a -tzip -mx=9 "../../../out/QutoofStudio-$V-update.zip" resources/app.asar resources/app.asar.unpacked/src resources/three > /dev/null
          # المحتوى التجريبي المدمج (الحلقات) — بس لو اتغير
          7z a -tzip -mx=9 "../../../out/QutoofStudio-$V-content.zip" resources/content > /dev/null
          cd ../../..
          ls -la out

      - name: النشر كـ Release (مسوّدة)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: "ستديو قطوف v${{ steps.v.outputs.version }} (ويندوز) — بناء ${{ github.run_number }}"
          draft: true
          body: |
            ستديو قطوف — رندر الحلقات على كارت الشاشة. من `EGYFIRE/Motion-Graphics` @ `${{ inputs.ref }}`.
            - `QutoofStudio-…-full-win.zip`: **أول مرة بس** — فكّه وشغّل `QutoofStudio.exe` (لو ويندوز حذّر: More info ← Run anyway).
            - `QutoofStudio-…-update.zip` (صغير): **تحديث** — اقفل البرنامج، وفكّه جوه نفس فولدره (اللي فيه `QutoofStudio.exe`) ووافق على استبدال الملفات.
            - `QutoofStudio-…-content.zip`: الحلقات التجريبية المدمجة — بس لو اتغيرت (نفس طريقة التحديث).
          files: out/*.zip
