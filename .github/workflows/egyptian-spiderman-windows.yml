name: Build Windows (الرجل العنكبوت المصري)

# لعبة PC. السورس خاص في EGYFIRE/Spider-man-EGYPTIAN، والبناء هنا عشان دقايق الريبو العام مجانية.
# النسخة الحالية (0.x) مبنية على Panda3D: الأصول (موديلات، أصوات، تكستشرز) متولّدة ومتسجلة في
# الريبو الخاص، فالبناء هنا مجرد تجميع exe لويندوز (cross-build من Linux) من غير GPU ولا رخص.
# الناتج مسوّدة دايمًا، بتاج فريد ببادئة  esm-v
#
# محتاج Secret واحد بس: SOURCE_REPO_TOKEN (موجود بالفعل لباقي المشاريع).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "الفرع أو الكوميت في EGYFIRE/Spider-man-EGYPTIAN — ابعته صراحةً!"
        required: true
        default: "claude/egyptian-spiderman-game-a2uxhk"

permissions:
  contents: write

concurrency:
  group: egyptian-spiderman-windows
  cancel-in-progress: false

jobs:
  build:
    name: بناء ونشر الرجل العنكبوت المصري (Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source (private repo)
        uses: actions/checkout@v4
        with:
          repository: EGYFIRE/Spider-man-EGYPTIAN
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: src

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools wheel "panda3d==1.10.16"

      - name: Read version
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'src'); from game.config import GAME_VERSION; print(GAME_VERSION)")
          SHORT_SHA=$(git -C src rev-parse --short HEAD)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "النسخة: $VERSION  —  الكوميت: $SHORT_SHA"

      - name: Build Windows executable (build_apps, cross-build)
        working-directory: src
        env:
          ESM_PLATFORMS: win_amd64
        run: python setup.py build_apps

      - name: Sanity check
        run: |
          test -f src/build/win_amd64/EgyptianSpiderMan.exe
          test -d src/build/win_amd64/assets/models/characters
          test -d src/build/win_amd64/game/graphics/shaders
          du -sh src/build/win_amd64

      - name: Package zip
        run: |
          cd src/build/win_amd64
          zip -qr -9 "$GITHUB_WORKSPACE/EgyptianSpiderMan-v${VERSION}-win64.zip" .
          ls -la "$GITHUB_WORKSPACE"/*.zip

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: esm-v${{ env.VERSION }}-b${{ github.run_number }}
          name: "الرجل العنكبوت المصري v${{ env.VERSION }} — بناء رقم ${{ github.run_number }}"
          body: |
            نسخة Windows 64-bit من EGYFIRE/Spider-man-EGYPTIAN (الكوميت ${{ env.SHORT_SHA }}، الفرع ${{ inputs.ref }}).
            فك الضغط وشغّل EgyptianSpiderMan.exe
          files: EgyptianSpiderMan-v${{ env.VERSION }}-win64.zip
          fail_on_unmatched_files: true
          # مسوّدة: الريبو عام ليأخذ دقائق Actions المجانية، لا لينشر النسخ للعامة.
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
