name: Build Android APK (AiLocal)

# السورس خاص في EGYFIRE/Ai-Local-Apk ولا يُبنى هناك أبدًا: الريبوهات الخاصة
# تشترك في 2000 دقيقة شهريًا فقط. البناء يتم هنا (ريبو عام = دقائق مجانية غير
# محدودة)، والناتج يُنشر كـ Release على هذا الريبو بتاج يبدأ بـ ailocal-.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "الفرع أو الكوميت في الريبو الخاص المطلوب بناؤه"
        required: false
        default: "claude/kotlin-local-ai-android-bfwj0t"
      run_tests:
        description: "تشغيل اختبارات الخادم والتطبيق قبل البناء"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  build:
    name: بناء ونشر AiLocal
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source (private repo)
        uses: actions/checkout@v4
        with:
          repository: EGYFIRE/Ai-Local-Apk
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # الافتراضي يثبّت حزمة "tools" التي سحبتها جوجل من المستودع فيفشل
          # الإعداد؛ نتركه فارغًا ونثبّت ما نحتاجه بأنفسنا في الخطوة التالية.
          packages: ""

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # ── اختبارات الخادم ────────────────────────────────────────────────
      - name: Set up Python
        if: ${{ inputs.run_tests == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: اختبارات الخادم
        if: ${{ inputs.run_tests == 'true' }}
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m pytest tests/ -v

      # ── اختبارات التطبيق ───────────────────────────────────────────────
      # أخطاء الترجمة تضيع وسط آلاف أسطر stack trace من Gradle؛ نلتقط
      # السجلّ ونعيد طبع أسطر الأخطاء وحدها في النهاية.
      - name: اختبارات التطبيق
        if: ${{ inputs.run_tests == 'true' }}
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest 2>&1 | tee ../build-tests.log || {
            echo "::group::أخطاء الترجمة والاختبارات"
            grep -E "^e: |^w: .*error|FAILED|Unresolved|expected:|actual:" ../build-tests.log | head -60
            echo "::endgroup::"
            exit 1
          }

      # ── البناء ────────────────────────────────────────────────────────
      - name: قراءة رقم الإصدار من المشروع
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' android/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=ailocal-v$VERSION-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "بناء الإصدار $VERSION"

      - name: بناء APK و AAB
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease bundleRelease 2>&1 | tee ../build-release.log || {
            echo "::group::أخطاء البناء"
            grep -E "^e: |FAILED|Unresolved|error:" ../build-release.log | head -60
            echo "::endgroup::"
            exit 1
          }

      - name: تجهيز الملفات
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ailocal-$VERSION.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/ailocal-$VERSION.aab"
          # حزمة الخادم: يُثبَّت على الحاسوب لا على الهاتف، فيُرفق مع الإصدار.
          ( cd server && zip -qr "../dist/ailocal-server-$VERSION.zip" . \
              -x '*.pyc' -x '__pycache__/*' -x '*/__pycache__/*' \
              -x '.venv/*' -x 'config.yaml' -x 'jobs.db*' )
          ( cd dist && sha256sum ./*.apk ./*.aab ./*.zip > SHA256SUMS.txt )
          ls -la dist

      - name: تجهيز وصف الإصدار
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="docs/release-notes/v$VERSION.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" release-body.md; else printf '## AiLocal %s\n' "$VERSION" > release-body.md; fi
          {
            printf '\n**ذكاء اصطناعي على جهازك، بلا تكلفة وبلا إزعاج.**\n\n'
            printf 'خادم يعمل على حاسوبك داخل صندوق موارد مقيّد بـ Windows Job Objects،\n'
            printf 'وتطبيق أندرويد يتحكّم فيه عبر الشبكة المحلية.\n\n'
            printf -- '---\n\n### الملفات\n\n'
            printf '| الملف | أين يُثبَّت |\n|---|---|\n'
            printf '| `ailocal-%s.apk` | الهاتف |\n' "$VERSION"
            printf '| `ailocal-server-%s.zip` | الحاسوب — فُكّه ثم `.\\install-windows.ps1` |\n\n' "$VERSION"
            printf '> ملف APK موقّع بمفتاح التطوير (debug) — كافٍ للتجربة والتثبيت المباشر،\n'
            printf '> ويحتاج مفتاح نشر حقيقي قبل الرفع على Google Play.\n\n'
            printf '```\n'; sed 's|\./||' dist/SHA256SUMS.txt; printf '```\n\n'
            printf '_بُني من الريبو الخاص `EGYFIRE/Ai-Local-Apk` عند `%s` — بناء رقم %s._\n' "${{ inputs.ref }}" "${{ github.run_number }}"
          } >> release-body.md

      - name: نشر الإصدار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "AiLocal — إصدار v${{ steps.version.outputs.version }} (بناء ${{ github.run_number }})"
          body_path: release-body.md
          files: dist/*
          fail_on_unmatched_files: true
          # مسوّدة: الملفات لا تظهر لأحد إلا لأصحاب صلاحية الكتابة على الريبو.
          # الريبو عام ليأخذ دقائق Actions المجانية، لا لينشر النسخ للعامة.
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
