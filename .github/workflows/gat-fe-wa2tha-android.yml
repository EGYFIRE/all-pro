name: Build Android APK (جات في وقتها)

# السورس خاص في EGYFIRE/Apk-e7sas ولا يُبنى هناك أبدًا: الريبوهات الخاصة تشترك في
# 2000 دقيقة شهريًا فقط. البناء يتم هنا (ريبو عام = دقائق مجانية غير محدودة)، والناتج
# يُنشر كـ Release (مسوّدة) على هذا الريبو بتاج يبدأ بـ gat-fe-wa2tha-.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "الفرع أو الكوميت في الريبو الخاص المطلوب بناؤه"
        required: false
        default: "claude/mood-listening-app-a3owud"
      version:
        description: "رقم الإصدار (versionName)"
        required: false
        default: "1.2.0"
      upload_to_play:
        description: "رفع الـ AAB على Google Play (مسار internal كمسودة) — محتاج secret PLAY_SERVICE_ACCOUNT_JSON"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: gat-fe-wa2tha-android
  cancel-in-progress: false

jobs:
  build:
    name: بناء ونشر جات في وقتها
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source (private repo)
        uses: actions/checkout@v4
        with:
          repository: EGYFIRE/Apk-e7sas
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # الـ runner فيه Android SDK جاهز؛ android-actions/setup-android@v3 بيفشل لأنه بيحاول
      # يثبّت حزمة "tools" القديمة اللي اتشالت.
      - name: Install required SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: اختبارات التطبيق
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest

      # versionCode = 100 + رقم البناء: دايمًا أكبر من النسخ اللي اتثبتت يدوي (1..3).
      - name: بناء APK و AAB
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease \
            -PversionName="${{ inputs.version }}" \
            -PversionCode="$((100 + ${{ github.run_number }}))"

      - name: تجهيز الملفات
        run: |
          VERSION="${{ inputs.version }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/gat-fe-wa2tha-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/gat-fe-wa2tha-$VERSION.aab"
          ( cd dist && sha256sum ./*.apk ./*.aab > SHA256SUMS.txt )
          {
            printf '## جات في وقتها %s\n\n' "$VERSION"
            printf 'قول حاسس بإيه… وتسمع آية مناسبة بصوت الشيخ منصور السالمي.\n\n'
            printf -- '- `.apk` للتثبيت المباشر على الموبايل\n- `.aab` للرفع على Google Play\n\n'
            printf '```\n'; sed 's|\./||' dist/SHA256SUMS.txt; printf '```\n\n'
            printf '_بُني من الريبو الخاص `EGYFIRE/Apk-e7sas` عند `%s` — بناء رقم %s (versionCode %s)._\n' \
              "${{ inputs.ref }}" "${{ github.run_number }}" "$((100 + ${{ github.run_number }}))"
          } > release-body.md

      - name: نشر الإصدار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gat-fe-wa2tha-v${{ inputs.version }}-b${{ github.run_number }}
          name: "جات في وقتها — v${{ inputs.version }} (بناء ${{ github.run_number }})"
          body_path: release-body.md
          files: dist/*
          fail_on_unmatched_files: true
          # مسوّدة: الملفات لا تظهر إلا لأصحاب صلاحية الكتابة على الريبو.
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: رفع على Google Play (internal — مسودة)
        if: ${{ inputs.upload_to_play == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.egyfire.gatfewa2tha
          releaseFiles: dist/gat-fe-wa2tha-${{ inputs.version }}.aab
          track: internal
          status: draft
