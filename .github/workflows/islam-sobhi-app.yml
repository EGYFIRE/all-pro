name: تطبيق إسلام صبحي

# السورس خاص في EGYFIRE/islam_sobhi_ssd_copy_v2 ولا يُبنى هناك أبدًا (الريبوهات الخاصة تشترك في 2000 دقيقة/شهر).
# البناء هنا (ريبو عام = دقائق مجانية)، والناتج Release بتاج يبدأ بـ islam-sobhi-app-.
#
# إعدادات المشروع كما هي في السورس (للمرجع):
#   pubspec: sdk '>=3.1.2 <4.0.0'  →  Dart 3.x  →  Flutter 3.19.6 (مُثبّتة، وهي النسخة اللي نجح بها البناء)
#   android/build.gradle: أسلوب plugins{} الحديث (dev.flutter.flutter-gradle-plugin)
#   gradle-wrapper: Gradle 7.5 · compileSdk 34 · minSdk 23  →  JDK 17
#   google-services.json موجود في السورس — لا يحتاج أي تدخل.
#
# التوقيع: الـAPK موقّع بمفتاح debug. افتراضيًا يتولّد مفتاح جديد كل بناء، وده
# معناه إن كل نسخة مش هتتثبت فوق اللي قبلها. لتثبيت مفتاح واحد دائم، جهّز مخزنًا
# مرة واحدة على جهازك:
#   keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
#     -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
#     -dname "CN=Android Debug,O=Android,C=US"
#   base64 -w0 debug.keystore
# وحُط الناتج في secret على all-pro اسمه ANDROID_DEBUG_KEYSTORE_B64.
# (كلمة المرور والـalias لازم يفضلوا بالقيم القياسية اللي فوق.)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "الفرع أو الكوميت في الريبو الخاص (فاضي = الفرع الافتراضي)"
        required: false
        default: ""
      flutter_version:
        description: "نسخة Flutter"
        required: false
        default: "3.19.6"
      java_version:
        description: "نسخة Java"
        required: false
        default: "17"
      guest_mode:
        description: "دخول كضيف — يتخطّى شاشة تسجيل الدخول (للتجربة فقط)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

jobs:
  build:
    name: بناء تطبيق إسلام صبحي
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source (private repo)
        uses: actions/checkout@v4
        with:
          repository: EGYFIRE/islam_sobhi_ssd_copy_v2
          ref: ${{ inputs.ref || '' }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: كشف إعدادات المشروع
        id: detect
        run: |
          echo "--- pubspec environment ---"; sed -n '/^environment:/,/^[a-z]/p' pubspec.yaml || true
          echo "--- .metadata ---"; cat .metadata 2>/dev/null || true
          FV="${{ inputs.flutter_version }}"
          if [ -z "$FV" ]; then
            FV=$(grep -E '^\s+flutter:' pubspec.yaml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          fi
          if [ -z "$FV" ]; then FV="3.19.6"; echo "لم تُحدَّد نسخة Flutter في pubspec — استخدام $FV"; fi
          echo "flutter=$FV" >> "$GITHUB_OUTPUT"
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:\s*//; s/\+.*//' | tr -d ' \r')
          [ -z "$VERSION" ] && VERSION="0.0.0"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=islam-sobhi-app-v$VERSION-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Flutter=$FV  Version=$VERSION"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ inputs.java_version || '17' }}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '3.19.6' }}
          channel: stable
          cache: true

      - name: تجهيز مفتاح التوقيع (وقت البناء فقط)
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -e
          mkdir -p "$HOME/.android"
          KS="$HOME/.android/debug.keystore"

          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            # إخفاء القيم الحسّاسة من السجل قبل أي استخدام
            echo "::add-mask::$RELEASE_STORE_PASSWORD"
            echo "::add-mask::$RELEASE_KEY_PASSWORD"
            echo "::add-mask::$RELEASE_KEY_ALIAS"

            KS="$RUNNER_TEMP/release.jks"
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$KS"
            chmod 600 "$KS"
            STOREPASS="$RELEASE_STORE_PASSWORD"
            ALIAS="$RELEASE_KEY_ALIAS"
            KEYPASS="${RELEASE_KEY_PASSWORD:-$RELEASE_STORE_PASSWORD}"
            MODE="مفتاح النشر الحقيقي"
          elif [ -n "$DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$KS"
            STOREPASS=android; ALIAS=androiddebugkey; KEYPASS=android
            MODE="مفتاح debug ثابت من secret"
          else
            keytool -genkeypair -v -keystore "$KS" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null
            STOREPASS=android; ALIAS=androiddebugkey; KEYPASS=android
            MODE="مفتاح debug مؤقت (جديد لكل بناء)"
            echo "::warning::لا يوجد مفتاح ثابت — الـAPK لن يُثبَّت فوق أي نسخة مثبتة مسبقًا."
          fi
          echo "التوقيع: $MODE"

          # البصمة وحدها تُطبع (ليست سرًا) — لتسجيلها في Firebase
          keytool -list -keystore "$KS" -storepass "$STOREPASS" -alias "$ALIAS" 2>/dev/null \
            | sed -n 's/.*SHA-256: */بصمة SHA-256: /p' || true

          GP=android/app/build.gradle
          [ -f "$GP" ] || GP=android/app/build.gradle.kts
          if grep -q 'key.properties' "$GP" 2>/dev/null && [ ! -f android/key.properties ]; then
            {
              echo "storePassword=$STOREPASS"
              echo "keyPassword=$KEYPASS"
              echo "keyAlias=$ALIAS"
              echo "storeFile=$KS"
            } > android/key.properties
            chmod 600 android/key.properties
            echo "أُنشئ key.properties (لا يُدفع لأي مستودع)."
          fi

      - name: توافق مع --split-per-abi (وقت البناء فقط)
        run: |
          set -e
          # المستودع بيحدد ndk abiFilters في buildTypes.release، وGradle بيرفض
          # وجودها مع splits abi. --split-per-abi بيأدي نفس الغرض وأدق.
          if grep -q 'abiFilters' android/app/build.gradle; then
            sed -i '/abiFilters/d' android/app/build.gradle
            echo "أُزيلت abiFilters وقت البناء — لا تُدفع لأي مستودع."
          else
            echo "لا توجد abiFilters — تخطّي."
          fi

      - name: وضع الضيف (تعديل وقت البناء فقط)
        if: inputs.guest_mode == 'true'
        run: |
          set -e
          python3 - <<'PY'
          import sys, pathlib
          errs = []

          # (أ) checkAuth: بدل تخطّي تسجيل الدخول وترك user = null،
          #     نبني UserModel ضيف كامل — لأن MainPage وغيره يستخدمون user! مباشرة.
          p = pathlib.Path('lib/features/authentication/presentation/bloc/authentication_cubit.dart')
          s = p.read_text()
          old = "    }else{\n      emit(state.copyWith(authState: AuthState.login));\n    }"
          new = ("    }else{\n"
                 "      // وضع الضيف — تعديل وقت البناء فقط\n"
                 "      user = UserModel(\n"
                 "        id: 0, full_name: 'ضيف', premium: false,\n"
                 "        credit: 0, points: 0, referral: '',\n"
                 "        otp_approved: true, is_new_user: false,\n"
                 "        profile_picture: '',\n"
                 "      );\n"
                 "      editedUser = user;\n"
                 "      emit(state.copyWith(authState: AuthState.loggedIn));\n    }")
          if old in s:
              p.write_text(s.replace(old, new, 1))
              print("✔ checkAuth: أُنشئ مستخدم ضيف")
          else:
              errs.append("checkAuth")

          # (ب) MainPage: user! يسبّب انهيارًا فوريًا لو بقي null لأي سبب
          p = pathlib.Path('lib/features/main/presentation/main/main_page.dart')
          s = p.read_text()
          if 'cubit.user!.premium' in s:
              p.write_text(s.replace('cubit.user!.premium', '(cubit.user?.premium ?? false)', 1))
              print("✔ MainPage: user! صار آمنًا ضد null")
          else:
              errs.append("MainPage")

          if errs:
              sys.exit("::error::تعذّر تفعيل وضع الضيف — لم يُعثر على الكود المتوقّع في: " + ", ".join(errs))
          PY
          echo "::warning::وضع الضيف مفعّل: الأقسام المحلية فقط تعمل؛ أي شاشة تحتاج السيرفر ستكون فارغة."

      - name: flutter pub get
        run: flutter pub get

      - name: بناء APK (release · arm64-v8a فقط)
        run: |
          # --no-shrink يعطّل R8: بدونه يشوّش/يحذف كلاسات الـplugins التي
          # تُحمَّل بالانعكاس، فتفشل قنوات المنصّة برسالة
          # "Unable to establish connection on channel" (ظهرت في firebase_auth
          # عند التحقق من رقم الهاتف). المشروع لا يحوي proguard-rules.pro.
          flutter build apk --release --no-shrink --split-per-abi --target-platform android-arm64

      - name: تجهيز الملف
        run: |
          set -e
          rm -rf dist && mkdir -p dist
          APK=$(find build/app/outputs -name 'app-arm64-v8a-release.apk' | head -1)
          if [ -z "$APK" ]; then echo '::error::لم يُعثر على APK الخاص بـ arm64-v8a'; find build/app/outputs -name '*.apk'; exit 1; fi
          cp "$APK" "dist/islam-sobhi-app-${{ steps.detect.outputs.version }}-arm64-v8a-release.apk"
          ls -la dist
          echo "size=$(du -h dist/*.apk | cut -f1)" >> "$GITHUB_OUTPUT"
        id: pack

      - name: تجهيز وصف الإصدار
        run: |
          {
            printf '## تطبيق إسلام صبحي — إصدار تجريبي\n\n'
            printf '> نسخة **release** للتجربة والتثبيت المباشر.\n\n'
            printf -- '- النسخة: `%s`\n' "${{ steps.detect.outputs.version }}"
            printf -- '- المعمارية: `arm64-v8a` (أجهزة 64-بت الحديثة)\n'
            printf -- '- الحجم: `%s`\n' "${{ steps.pack.outputs.size }}"
            printf -- '- Flutter: `%s` · Java: `%s`\n' "${{ inputs.flutter_version || '3.19.6' }}" "${{ inputs.java_version || '17' }}"
          } > release-body.md

      - name: نشر الإصدار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.detect.outputs.tag }}
          name: "تطبيق إسلام صبحي — تجريبي v${{ steps.detect.outputs.version }} (بناء ${{ github.run_number }})"
          body_path: release-body.md
          files: dist/*.apk
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: محو آثار المفتاح
        if: always()
        run: |
          shred -u "$RUNNER_TEMP/release.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/release.jks"
          shred -u android/key.properties 2>/dev/null || rm -f android/key.properties
          rm -f "$HOME/.android/debug.keystore"
          echo "تم محو مخزن المفاتيح وkey.properties من الـrunner."
